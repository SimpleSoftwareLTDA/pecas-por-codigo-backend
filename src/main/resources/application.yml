management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health"
  metrics:
    tags:
      application: ${spring.application.name}

sentry:
  dsn: https://a38bb9accdec0016b8cb6ec8be911d89@o4510377647931392.ingest.us.sentry.io/4510377659269121
  # Add data like request headers and IP for users,
  # see https://docs.sentry.io/platforms/java/guides/spring-boot/data-management/data-collected/ for more info
  send-default-pii: true
  # Enable sending logs to Sentry
  logs:
    enabled: true
  # Set traces-sample-rate to 1.0 to capture 100% of transactions for tracing.
  # We recommend adjusting this value in production.
  traces-sample-rate: 1.0


spring:
  application:
    name: novo-pecas-online
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    enabled: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 10000
        order_inserts: true
        order_updates: true
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}
      time-to-live: 120000

app:
  url: ${CURRENT_URL:}
  site_url: ${SITE_URL:https://www.pecasporcodigo.com.br}

decodo:
  proxy:
    host: br.decodo.com
    port: 10007
    username: ${DECODO_USER}
    password: ${DECODO_PASS}
