spring:
  application:
    name: novo-pecas-online
  mail:
    enabled: true
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    # Use a app password gerada no Gmail
    password: ${MAIL_PASSWORD}
    from-email: ${SET_FROM_EMAIL}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
        imap:
          host: imap.gmail.com
          port: 993
          ssl.enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
    imap:
      enabled: true
      inbox-folder: INBOX
      spam-folder: "[Gmail]/Spam"
      processed-folder: Processed
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    operationsSorter: method
    tagsSorter: method
    disable-swagger-default-url: true
logging:
  level:
    org:
      pecasonline: INFO

server:
  forward-headers-strategy: native

app:
  url: ${CURRENT_URL:https://backend.pecasporcodigo.com.br/}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:*}

asaas:
  api:
    api-key: ${ASAAS_API_KEY}
    base-url: https://api.asaas.com/v3

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,metrics"
      base-path: /actuator

  endpoint:
    prometheus:
      enabled: true
    health:
      enabled: true
      show-details: always
    metrics:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name:pecasporcodigo}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s
    tracing:
      endpoint: ${OTEL_EXPORTER_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      endpoint: ${OTEL_EXPORTER_ENDPOINT:http://localhost:4318}/v1/logs