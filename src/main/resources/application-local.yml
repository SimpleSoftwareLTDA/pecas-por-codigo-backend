spring:
  datasource:
    url: ${DB_HOST}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  logging:
    level:
      pecasonline: DEBUG
      org.pecasonline: DEBUG
      root: DEBUG
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    baseline-on-migrate: true
  mail:
    enabled: false
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    # Use a app password gerada no Gmail
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        imap:
          host: imap.gmail.com
          port: 993
          ssl.enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    imap:
      enabled: true
      inbox-folder: INBOX
      processed-folder: Processed

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    operationsSorter: method
    tagsSorter: method

app:
  url: ${CURRENT_URL:}

asaas:
  api:
    api-key: ${ASAAS_API_KEY}
    base-url: https://sandbox.asaas.com/api/v3

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,metrics"
      base-path: /actuator

  endpoint:
    prometheus:
      enabled: true
    health:
      enabled: true
      show-details: always
    metrics:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name:pecasonline}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s
    tracing:
      endpoint: ${OTEL_EXPORTER_ENDPOINT:http://localhost:4318}/v1/traces