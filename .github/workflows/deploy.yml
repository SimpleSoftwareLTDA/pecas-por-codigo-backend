name: Deploy to OCI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to build and deploy (e.g., v1.2.3)'
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Determine the tag name based on the trigger
    env:
      IMAGE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # Check out the specific tag for manual runs
          ref: ${{ env.IMAGE_TAG }}

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            randintn/novo-pecas-online:${{ env.IMAGE_TAG }}
            randintn/novo-pecas-online:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Determine the tag name based on the trigger
    env:
      IMAGE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
    steps:
      - name: Deploy to OCI Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            docker compose pull
            docker compose up -d
