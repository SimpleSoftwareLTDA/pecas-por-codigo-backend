services:
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  novo-pecas-online-db:
    image: postgres:17-alpine
    env_file:
      - .env
    container_name: novo-pecas-online-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: ${DB_HOST}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  novo-pecas-online-backend:
    build:
      dockerfile: Dockerfile
      context: .
    env_file:
      - .env
    container_name: novo-pecas-online-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      ASAAS_API_KEY:
      # Ensure the application exports OTEL data to the collector service instead of localhost
      OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318
      # Point Spring Data Redis to the Redis service on the Docker network
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      UNLEASH_API_URL: ${UNLEASH_API_URL}
      UNLEASH_API_TOKEN: ${UNLEASH_API_TOKEN}
      UNLEASH_APP_NAME: ${UNLEASH_APP_NAME}
      UNLEASH_INSTANCE_ID: ${UNLEASH_INSTANCE_ID}
    ports:
      - "8080:8080"
    depends_on:
      - novo-pecas-online-db
      - otel-collector
      - redis
      - unleash-web

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    container_name: otel-collector
    restart: unless-stopped
    command: [ "--config=/etc/otelcol-contrib/config.yaml" ]
    ports:
      - "4318:4318"
    volumes:
      - ./monitoring/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - otel-collector

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
  unleash-db:
    image: postgres:15
    container_name: unleash-db
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash_user
      POSTGRES_PASSWORD: password123
    volumes:
      - unleash_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U unleash_user -d unleash" ]
      interval: 5s
      timeout: 5s
      retries: 5

  unleash-web:
    image: unleashorg/unleash-server:latest
    container_name: unleash-server
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: postgres://unleash_user:password123@unleash-db/unleash
      DATABASE_SSL: "false"
      LOG_LEVEL: warn
      UNLEASH_SECRET: "simple-software-secret-key-change-me"
      INIT_CLIENT_API_TOKENS: "default:development.unleash-insecure-api-token"
    depends_on:
      - unleash-db

volumes:
  postgres_data:
  grafana_data:
  unleash_db_data: