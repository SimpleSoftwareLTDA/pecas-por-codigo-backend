services:
  grafana:
    image: randintn/pecas-grafana:v1.0.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_ANONYMOUS_ORG_NAME=Peças Por Código
      - GF_SERVER_ROOT_URL=https://obs.pecasporcodigo.com.br
      - GF_SERVER_DOMAIN=obs.pecasporcodigo.com.br
      - GF_SECURITY_COOKIE_SAMESITE=none
      - GF_SECURITY_COOKIE_SECURE=true
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo

  tempo:
    image: randintn/pecas-tempo:v1.0.0
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yml" ]
    volumes:
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200" # Tempo
      - "4317" # OTLP gRPC
    restart: unless-stopped

  novo-pecas-online-db:
    image: postgres:17-alpine
    env_file:
      - .env
    container_name: novo-pecas-online-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  novo-pecas-online-backend:
    build:
      dockerfile: Dockerfile
      context: .
    env_file:
      - .env
    container_name: novo-pecas-online-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      ASAAS_API_KEY: ${ASAAS_API_KEY}
      OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318
      POSTGRES_HOST: novo-pecas-online-db
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      novo-pecas-online-db:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis:
        condition: service_started

  otel-collector:
    image: randintn/pecas-otel-collector:v1.0.0
    container_name: otel-collector
    restart: unless-stopped
    command: [ "--config=/etc/otelcol-contrib/config.yml" ]
    ports:
      - "4318:4318"

  prometheus:
    image: randintn/pecas-prometheus:v1.0.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    depends_on:
      - otel-collector

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]



volumes:
  postgres_data:
  grafana_data:
  prometheus_data:
  tempo_data:
  redis_data:
